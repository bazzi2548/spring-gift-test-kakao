plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'io.cucumber:cucumber-java:7.22.0'
	testImplementation 'io.cucumber:cucumber-spring:7.22.0'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.22.0'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('dockerBuild') {
	description = 'Builds the Docker image for the application'
	group = 'docker'
	doLast {
		exec {
			commandLine 'docker', 'build', '-t', 'gift-app', '.'
		}
	}
}

tasks.register('dockerUp') {
	description = 'Starts Docker Compose services'
	group = 'docker'
	doLast {
		exec {
			commandLine 'docker', 'compose', 'up', '-d', '--wait'
		}
	}
}

tasks.register('dockerDown') {
	description = 'Stops and removes Docker Compose containers'
	group = 'docker'
	doLast {
		exec {
			commandLine 'docker', 'compose', 'down'
		}
	}
}

tasks.register('cucumberTest', Test) {
	description = 'Runs Cucumber tests against Dockerized app and PostgreSQL'
	group = 'verification'
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'test.port', '28080'
	dependsOn 'dockerBuild'

	doFirst {
		exec {
			commandLine 'docker', 'compose', 'up', '-d', '--wait'
		}
	}
	finalizedBy 'dockerDown'
}
